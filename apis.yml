name: Aseon Labs
description: >-
  Aseon Labs builds robotic pitstops for self-driving cars — distributed robotic
  micro-depots (the "Aseon Pod") that automate charging, interior and exterior
  cleaning, and inspection for autonomous vehicle fleets directly within their
  operating zones, so vehicles reset locally instead of returning to centralized
  facilities. The company says the approach can cut reset costs by up to 50%,
  reduce downtime by ~65%, and add $50,000+ in annual revenue per vehicle.
  Founded in 2026 and backed by Y Combinator (Spring 2026 batch), the Redwood
  City, CA startup is a physical-infrastructure and robotics company; it does not
  currently publish a public API, developer portal, or machine-readable API
  specifications.
